# uMTP-Responder config: the whole SD card over MTP while Trimpod runs.
# mtp.sh sets up the FunctionFS gadget these endpoint paths point at.
loop_on_disconnect 1
storage "/mnt/SDCARD" "SD Card" "rw"
manufacturer "TrimUI"
product "Trimpod Classic"
serial "Trimpod"
mtp_extensions "microsoft.com: 1.0; android.com: 1.0;"
interface "MTP"
usb_class 0x6
usb_subclass 0x1
usb_protocol 0x1
usb_dev_version 0x3008
sync_when_close 0x1
# 32 KB: FunctionFS kmallocs one chunk per transfer, and 64 KB (order 4) fails once
# memory fragments, cutting the file off.
usb_max_rd_buffer_size 0x8000
usb_max_wr_buffer_size 0x8000
usb_functionfs_mode 0x1
usb_dev_path   "/dev/usb-ffs/mtp/ep0"
usb_epin_path  "/dev/usb-ffs/mtp/ep1"
usb_epout_path "/dev/usb-ffs/mtp/ep2"
usb_epint_path "/dev/usb-ffs/mtp/ep3"
usb_max_packet_size 0x200

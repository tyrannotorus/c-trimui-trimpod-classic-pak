# Builds both platform runtimes in the public NextUI toolchains and publishes the Pak Store
# release assets whenever a v* tag is pushed.
#
# The NextUI Pak Store pulls the asset named release_filename in pak.json from
# the GitHub release whose tag matches the pak.json "version", so this workflow
# enforces that the tag and pak.json version agree before publishing.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write          # create the GitHub release + upload the asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pak.json "version" must equal the pushed tag (Pak Store requirement).
      - name: Check pak.json version matches the tag
        run: |
          ver=$(grep -oE '"version"[[:space:]]*:[[:space:]]*"[^"]+"' pak.json \
                | grep -oE 'v[0-9][^"]*')
          echo "pak.json version: $ver   tag: ${GITHUB_REF_NAME}"
          [ "$ver" = "${GITHUB_REF_NAME}" ] || {
            echo "::error::pak.json version ($ver) != tag (${GITHUB_REF_NAME})"; exit 1; }

      - name: Build (Docker tg5040 + H700 toolchains)
        run: |
          bash tools/build_projectm.sh
          ./build.sh clean

      - name: Package pak + Pak Store zip
        run: ./package.sh

      - name: Publish GitHub release with the Pak Store asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/TrimPod(RUS).pak.zip" \
            "dist/TrimPod(RUS)-relink-kit.tar.gz" \
            third_party/wget/wget-1.24.5.tar.gz \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
